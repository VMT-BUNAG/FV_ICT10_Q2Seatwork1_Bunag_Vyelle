<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
    <title>ICT Club Checker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: url(https://thumbs.dreamstime.com/b/information-technology-roadmap-abstract-background-cover-page-pastel-pink-blue-colors-311760009.jpg);
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .container {
            background: linear-gradient(to bottom, #451536, #190e20);
            width: 300px;
            padding: 25px;
            text-align: center;
            border: 2px solid #ff80bd;
            border-radius: 15px;
            box-shadow: 0 0 20px #ff69b4;
        }

        h1 {
            color: #ffb6d9;
            margin-bottom: 5px;
        }

        h2 {
            color: #ff69b4;
            font-size: 18px;
        }

        p {
            color: #ffd6e7;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ff80bd;
            border-radius: 5px;
            background: #281525;
            color: white;
        }

        button {
            width: 98%;
            padding: 10px;
            margin-top: 10px;
            background: linear-gradient(to right, #ff9acb, #e72e8a);
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            box-shadow: 0 0 12px #ff69b4;
        }

        #output {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>ICT 10</h1>
        <h2>CLUB CHECKER</h2>
        <p>Candidate Verification System</p>

        <input type="text" id="first" placeholder="First Name">
        <input type="text" id="last" placeholder="Last Name">

        <button py-click="check_name">VERIFY CANDIDATE</button>
        <button py-click="clear_name">CLEAR</button>

        <p id="output"></p>
    </div>

    <script type="py" src="main.py"></script>

</body>

</html>
